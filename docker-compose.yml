services:
  claims-api:
    build:
      context: ./backend
    image: claims-api:local
    ports:
      - "5284:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  claims-frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: /api
        API_PROXY_TARGET: http://claims-api:8080
    image: claims-frontend:local
    ports:
      - "3000:3000"
    depends_on:
      - claims-api
