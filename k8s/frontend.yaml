apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-frontend
  labels:
    app: claims-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-frontend
  template:
    metadata:
      labels:
        app: claims-frontend
    spec:
      containers:
        - name: frontend
          image: claims-frontend
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /claims/new
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /claims/new
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: claims-frontend
  labels:
    app: claims-frontend
spec:
  type: LoadBalancer
  selector:
    app: claims-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
