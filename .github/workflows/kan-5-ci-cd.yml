name: KAN-5 CI/CD - Crear Siniestro Auto

on:
  pull_request:
    branches:
      - main
      - init
      - devin/1772548855-kan5-fullstack
    paths:
      - 'backend/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'k8s/**'
      - 'scripts/smoke-test.sh'
      - '.github/workflows/kan-5-ci-cd.yml'
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '22.x'
  BACKEND_PATH: backend
  FRONTEND_PATH: .
  REGISTRY: ghcr.io

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1 - BUILD: Compile backend (.NET) and frontend (React)
  # ═══════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Backend (.NET) ---
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        run: dotnet restore
        working-directory: ${{ env.BACKEND_PATH }}

      - name: Build backend
        run: dotnet build --no-restore --configuration Release
        working-directory: ${{ env.BACKEND_PATH }}

      # --- Frontend (React/Next.js) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Build frontend
        run: npm run build
        working-directory: ${{ env.FRONTEND_PATH }}

  # ═══════════════════════════════════════════════════════════
  # JOB 2 - TEST: Run xUnit tests and frontend lint
  # ═══════════════════════════════════════════════════════════
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        run: dotnet restore
        working-directory: ${{ env.BACKEND_PATH }}

      - name: Run xUnit tests
        run: dotnet test --no-restore --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
        working-directory: ${{ env.BACKEND_PATH }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ env.BACKEND_PATH }}/**/TestResults/*.trx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Lint frontend
        run: npm run lint
        working-directory: ${{ env.FRONTEND_PATH }}

  # ═══════════════════════════════════════════════════════════
  # JOB 3 - SECURITY: Snyk SCA scans (gate: severity >= high)
  # Skipped with a warning when SNYK_TOKEN is not configured
  # ═══════════════════════════════════════════════════════════
  security:
    name: Security (Snyk)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check Snyk configuration
        id: snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning::SNYK_TOKEN secret is not configured - Snyk scans skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.snyk.outputs.enabled == 'true'
        uses: actions/checkout@v4

      # --- Backend Snyk SCA ---
      - name: Setup .NET SDK
        if: steps.snyk.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        if: steps.snyk.outputs.enabled == 'true'
        run: dotnet restore
        working-directory: ${{ env.BACKEND_PATH }}

      - name: Snyk SCA - Backend (.NET)
        if: steps.snyk.outputs.enabled == 'true'
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=${{ env.BACKEND_PATH }}/ClaimsManagement.sln --severity-threshold=high

      # --- Frontend Snyk SCA ---
      - name: Setup Node.js
        if: steps.snyk.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        if: steps.snyk.outputs.enabled == 'true'
        run: npm ci
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Snyk SCA - Frontend (npm)
        if: steps.snyk.outputs.enabled == 'true'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=${{ env.FRONTEND_PATH }}/package.json --severity-threshold=high

  # ═══════════════════════════════════════════════════════════
  # JOB 4 - DOCKER: Build images + smoke test (always)
  # Push to GHCR only on push to main
  # ═══════════════════════════════════════════════════════════
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image names
        id: images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=${REGISTRY}/${owner}/claims-api" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${owner}/claims-frontend" >> "$GITHUB_OUTPUT"

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --no-build

      - name: Smoke test (health, UI, POST /api/claims)
        run: ./scripts/smoke-test.sh http://localhost:3000 http://localhost:5284

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          for tag in "${GITHUB_SHA}" latest; do
            docker tag claims-api:local "${API_IMAGE}:${tag}"
            docker tag claims-frontend:local "${FRONTEND_IMAGE}:${tag}"
            docker push "${API_IMAGE}:${tag}"
            docker push "${FRONTEND_IMAGE}:${tag}"
          done

  # ═══════════════════════════════════════════════════════════
  # JOB 5 - DEPLOY: Deploy to AKS (k8s/ manifests)
  # Only on push to main; skipped with a warning when
  # AZURE_CREDENTIALS / AKS vars are not configured
  # ═══════════════════════════════════════════════════════════
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Check Azure configuration
        id: azure
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ] || [ -z "$AKS_CLUSTER_NAME" ] || [ -z "$AKS_RESOURCE_GROUP" ]; then
            echo "::warning::AZURE_CREDENTIALS secret or AKS_CLUSTER_NAME/AKS_RESOURCE_GROUP variables not configured - deploy skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.azure.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Azure Login
        if: steps.azure.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        if: steps.azure.outputs.enabled == 'true'
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}

      - name: Configure GHCR image pull secret
        if: steps.azure.outputs.enabled == 'true'
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl create namespace claims --dry-run=client -o yaml | kubectl apply -f -
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "::notice::GHCR_PULL_TOKEN not set - assuming GHCR packages are public"
            exit 0
          fi
          kubectl -n claims create secret docker-registry ghcr-pull \
            --docker-server="${REGISTRY}" \
            --docker-username="${GITHUB_REPOSITORY_OWNER}" \
            --docker-password="${GHCR_PULL_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n claims patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Deploy manifests
        if: steps.azure.outputs.enabled == 'true'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl kustomize k8s \
            | sed -e "s#image: claims-api:local#image: ${REGISTRY}/${owner}/claims-api:${GITHUB_SHA}#" \
                  -e "s#image: claims-frontend:local#image: ${REGISTRY}/${owner}/claims-frontend:${GITHUB_SHA}#" \
            | kubectl apply -f -
          kubectl -n claims rollout status deployment/claims-api --timeout=300s
          kubectl -n claims rollout status deployment/claims-frontend --timeout=300s

      - name: Show service endpoint
        if: steps.azure.outputs.enabled == 'true'
        run: |
          kubectl -n claims get svc claims-frontend
          ip=$(kubectl -n claims get svc claims-frontend -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Frontend: http://${ip}/claims/new" >> "$GITHUB_STEP_SUMMARY"
