# =============================================================================
# KAN-5 CI/CD Pipeline — Gestión Siniestro Auto
# Validates backend (.NET 8) and frontend (Next.js/React), runs tests,
# executes Snyk security scanning, and deploys to AKS.
# =============================================================================

name: KAN-5 CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - init
    paths:
      - 'src/**'
      - 'tests/**'
      - 'GestionSiniestros.sln'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kan-5-ci-cd.yml'
  push:
    branches:
      - main

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  SOLUTION_FILE: 'GestionSiniestros.sln'
  API_PROJECT: 'src/GestionSiniestros.Api/GestionSiniestros.Api.csproj'
  TEST_PROJECT: 'tests/GestionSiniestros.Tests/GestionSiniestros.Tests.csproj'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# ---------------------------------------------------------------------------
# JOB 1 — Build
# ---------------------------------------------------------------------------
jobs:
  build:
    name: Build Backend & Frontend
    runs-on: ubuntu-latest

    steps:
      # ---- Checkout ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Backend (.NET 8) ----
      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build backend (Release)
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      # ---- Frontend (Next.js / React) ----
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # ---- Artifacts ----
      - name: Publish backend artifacts
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output ./publish/backend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./publish/backend
          retention-days: 5

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./.next
          retention-days: 5

  # ---------------------------------------------------------------------------
  # JOB 2 — Test
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Run xUnit tests
        run: |
          dotnet test ${{ env.SOLUTION_FILE }} \
            --configuration Release \
            --no-restore \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results
          retention-days: 5

  # ---------------------------------------------------------------------------
  # JOB 3 — Snyk Security Scan (SCA + SAST)
  # ---------------------------------------------------------------------------
  snyk-security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore .NET dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Install npm dependencies
        run: npm ci

      # ---- Snyk SCA — .NET ----
      - name: Snyk SCA — .NET dependencies
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=${{ env.SOLUTION_FILE }} --severity-threshold=high

      # ---- Snyk SCA — npm ----
      - name: Snyk SCA — npm dependencies
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high

      # ---- Snyk SAST — Code analysis ----
      - name: Snyk SAST — Code analysis
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # JOB 4 — Deploy to AKS (only on push to main)
  # ---------------------------------------------------------------------------
  deploy-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: [build, test, snyk-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: ./publish/backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./.next

      # ---- Azure Login ----
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---- ACR Build & Push ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend Docker image
        run: |
          docker build \
            -f src/GestionSiniestros.Api/Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/gestion-siniestros-api:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/gestion-siniestros-api:latest \
            ./publish/backend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/gestion-siniestros-api:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/gestion-siniestros-api:latest

      # ---- AKS Deploy ----
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy to AKS
        uses: azure/k8s-deploy@v5
        with:
          manifests: |
            k8s/backend-deployment.yml
            k8s/backend-service.yml
          images: |
            ${{ secrets.ACR_LOGIN_SERVER }}/gestion-siniestros-api:${{ github.sha }}
          namespace: gestion-siniestros
