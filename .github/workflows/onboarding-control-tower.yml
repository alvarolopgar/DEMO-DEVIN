name: Onboarding Control Tower CI

on:
  push:
    paths: ['onboarding-control-tower/**', '.github/workflows/onboarding-control-tower.yml']
  pull_request:
    paths: ['onboarding-control-tower/**', '.github/workflows/onboarding-control-tower.yml']

permissions:
  contents: read

concurrency:
  group: oct-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, tests y gate SDD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: onboarding-control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: onboarding-control-tower/package-lock.json
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Seguridad de dependencias (NFR-001-02)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run lint:openapi
      - name: Tipos generados alineados con el contrato
        run: npm run gen:types && git diff --exit-code -- apps/api/src/generated apps/web/src/api/generated
      - name: Unit, API, contrato, seguridad, componentes y gate
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: E2E de aceptación (AC-001-01..10)
        run: npm run test:e2e
      - name: Gate spec-conformance (NFR-001-01)
        run: npm run sdd:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            onboarding-control-tower/playwright-report/
            onboarding-control-tower/test-results/
          retention-days: 7
